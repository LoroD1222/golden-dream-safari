<!-- Self-contained WhatsApp floating widget: HTML, CSS and JavaScript only. -->
<aside class="wa-widget" aria-label="WhatsApp chat">
  <a class="wa-widget__prompt" href="#" target="_blank" rel="noopener noreferrer">
    <span aria-hidden="true">💬</span> Chat with us
  </a>
  <a class="wa-widget__fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp">
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
    </svg>
  </a>
</aside>

<style>
  .wa-widget {
    position: fixed;
    z-index: 9999;
    right: max(22px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    display: grid;
    justify-items: end;
    font-family: Arial, sans-serif;
  }
  .wa-widget__prompt {
    position: absolute;
    right: 0;
    bottom: 74px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-width: max-content;
    padding: 11px 17px;
    border-radius: 999px;
    background: #0b0907;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity .38s ease, transform .38s cubic-bezier(.22, .75, .25, 1);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .wa-widget__prompt.is-visible {opacity: 1; pointer-events: auto; transform: translateY(0)}
  .wa-widget__fab {
    position: relative;
    display: grid;
    width: 62px;
    height: 62px;
    place-items: center;
    border-radius: 50%;
    background: #25d366;
    box-shadow: 0 10px 28px rgba(15, 128, 63, .32);
    isolation: isolate;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .wa-widget__fab::before {
    position: absolute;
    z-index: -1;
    inset: 0;
    border-radius: inherit;
    background: rgba(37, 211, 102, .4);
    content: "";
    animation: wa-pulse 2.2s ease-out infinite;
  }
  .wa-widget__fab svg {width: 31px; height: 31px; fill: #fff}
  .wa-widget__fab:hover {transform: translateY(-2px) scale(1.03)}
  @keyframes wa-pulse {
    0%, 35% {opacity: .8; transform: scale(1)}
    75%, 100% {opacity: 0; transform: scale(1.48)}
  }
  @media (max-width: 760px) {
    .wa-widget {right: max(15px, env(safe-area-inset-right)); bottom: max(15px, env(safe-area-inset-bottom))}
    .wa-widget__fab {width: 54px; height: 54px}
    .wa-widget__fab svg {width: 27px; height: 27px}
    .wa-widget__prompt {bottom: 64px; padding: 9px 14px; font-size: 14px}
  }
  @media (prefers-reduced-motion: reduce) {
    .wa-widget__prompt, .wa-widget__fab {transition-duration: .01ms}
    .wa-widget__fab::before {animation: none}
  }
</style>

<script>
  (() => {
    const number = "255763571646";
    const message = "Hello! I'm interested in booking a safari. Can you help me?";
    const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
    const widget = document.querySelector(".wa-widget");
    const prompt = widget.querySelector(".wa-widget__prompt");

    widget.querySelectorAll("a").forEach((link) => { link.href = url; });
    window.setTimeout(() => prompt.classList.add("is-visible"), 800);
    window.setTimeout(() => prompt.classList.remove("is-visible"), 7000);
  })();
</script>
